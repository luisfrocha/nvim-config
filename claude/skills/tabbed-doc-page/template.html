<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        :root {
            --bg: #fafbfc;
            --surface: #ffffff;
            --surface-2: #f4f6f8;
            --surface-3: #e8ecf0;
            --border: #e2e6ea;
            --border-light: #d0d5db;
            --text: #1d1d1f;
            --text-secondary: #515c6b;
            --text-muted: #8a919c;
            --accent: #3478f6;
            --accent-light: #e8f0fe;
            --accent-dark: #2660d4;
            --green: #34c759;
            --green-light: #e6f9ed;
            --green-dark: #248a3d;
            --orange: #ff9500;
            --orange-light: #fff4e0;
            --red: #ff3b30;
            --red-light: #ffeae9;
            --purple: #af52de;
            --purple-light: #f5ecfb;
            --teal: #5ac8fa;
            --teal-light: #e6f7fd;
            --yellow: #ffcc00;
            --yellow-light: #fff9db;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Hero ── */
        .hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            color: #fff;
            padding: 72px 48px 64px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(52,120,246,0.12) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 50%, rgba(175,82,222,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .hero-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 28px;
            backdrop-filter: blur(10px);
        }
        .hero-logo svg {
            width: 20px; height: 20px;
        }
        .hero h1 {
            font-size: 50px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 16px;
            position: relative;
        }
        .hero .subtitle {
            font-size: 19px;
            color: rgba(255,255,255,0.7);
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.55;
            position: relative;
        }

        /* ── Nav ── */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 48px;
        }
        .nav-inner {
            max-width: 1260px;
            margin: 0 auto;
            display: flex;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-inner::-webkit-scrollbar { display: none; }
        .nav-tab {
            padding: 16px 18px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            border-bottom: 2.5px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
            background: none;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .nav-tab:hover { color: var(--text); }
        .nav-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .tab-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
        }
        .tab-dot.live { background: var(--green); }
        .tab-dot.pending { background: var(--orange); }

        /* ── Container ── */
        .container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 48px;
        }

        /* ── Section ── */
        .section {
            display: none;
            padding: 48px 0 80px;
            animation: fadeUp 0.35s ease;
        }
        .section.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .section-header {
            margin-bottom: 36px;
        }
        .section-header h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .section-header p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 700px;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border-light);
        }
        .card h3 {
            font-size: 19px;
            font-weight: 650;
            margin-bottom: 10px;
            color: var(--text);
        }
        .card p {
            font-size: 14.5px;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        /* ── Banner ── */
        .banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            font-size: 13.5px;
            font-weight: 500;
        }
        .banner svg { flex-shrink: 0; }
        .banner.info { background: var(--accent-light); color: var(--accent-dark); border: 1px solid rgba(52,120,246,0.2); }
        .banner.warn { background: var(--orange-light); color: #b36b00; border: 1px solid rgba(255,149,0,0.25); }
        .banner.success { background: var(--green-light); color: var(--green-dark); border: 1px solid rgba(52,199,89,0.25); }
        .banner.note { background: var(--yellow-light); color: #7a6200; border: 1px solid rgba(255,204,0,0.3); }

        /* ── Overview Grid ── */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }
        .ov-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s;
        }
        .ov-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .ov-card .stripe {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3.5px;
        }
        .ov-card .stripe.blue { background: var(--accent); }
        .ov-card .stripe.green { background: var(--green); }
        .ov-card .stripe.purple { background: var(--purple); }
        .ov-card .stripe.orange { background: var(--orange); }
        .ov-card .stripe.red { background: var(--red); }
        .ov-card .stripe.teal { background: var(--teal); }
        .ov-icon {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .ov-icon svg { width: 20px; height: 20px; }
        .ov-icon.blue { background: var(--accent-light); color: var(--accent); }
        .ov-icon.green { background: var(--green-light); color: var(--green-dark); }
        .ov-icon.purple { background: var(--purple-light); color: var(--purple); }
        .ov-icon.orange { background: var(--orange-light); color: #b36b00; }
        .ov-icon.red { background: var(--red-light); color: var(--red); }
        .ov-icon.teal { background: var(--teal-light); color: #0077b6; }
        .ov-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .ov-card h4 {
            font-size: 15px;
            font-weight: 620;
            margin-bottom: 0;
        }
        .ov-card p {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ── Screenshot ── */
        .screenshot-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .screenshot-wrap img {
            width: 100%;
            border-radius: calc(var(--radius) - 4px);
            display: block;
        }
        .screenshot-caption {
            padding: 12px 16px 8px;
            font-size: 12.5px;
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
        }
        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        /* ── Asset Section (blended card + screenshot) ── */
        .card.asset-section {
            padding-bottom: 0;
            overflow: hidden;
        }
        .asset-screenshot {
            margin: 20px -28px 0;
            border-top: 1px solid var(--border);
            overflow: hidden;
        }
        .asset-screenshot img {
            width: 100%;
            display: block;
        }

        /* ── Feature List ── */
        .feature-list {
            list-style: none;
            padding: 0;
        }
        .feature-list li {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14.5px;
            color: var(--text-secondary);
            line-height: 1.55;
        }
        .feature-list li:last-child { border-bottom: none; }
        .feature-list .icon {
            flex-shrink: 0;
            width: 24px; height: 24px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            margin-top: 1px;
        }
        .feature-list .icon.blue { background: var(--accent-light); color: var(--accent); }
        .feature-list .icon.green { background: var(--green-light); color: var(--green-dark); }
        .feature-list .icon.purple { background: var(--purple-light); color: var(--purple); }
        .feature-list .icon.orange { background: var(--orange-light); color: #b36b00; }

        /* ── Flow Diagram (dark) ── */
        .flow-container {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: var(--radius);
            padding: 40px 32px 32px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .flow-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }
        .flowchart-svg {
            width: 100%;
            height: auto;
        }
        .flowchart-svg text {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        }

        /* ── Two-Column ── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .two-col { grid-template-columns: 1fr; }
            .screenshot-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 36px; }
            .container { padding: 0 20px; }
            .nav-bar { padding: 0 20px; }
        }

        /* ── Timeline Steps ── */
        .steps {
            position: relative;
            padding-left: 36px;
        }
        .steps::before {
            content: '';
            position: absolute;
            left: 13px; top: 8px; bottom: 8px;
            width: 2px;
            background: var(--border);
        }
        .step {
            position: relative;
            margin-bottom: 24px;
        }
        .step:last-child { margin-bottom: 0; }
        .step::before {
            content: '';
            position: absolute;
            left: -30px; top: 5px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--surface);
            border: 2.5px solid var(--accent);
        }
        .step.done::before {
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
        }
        .step h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .step p {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ── Tags ── */
        .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .tag {
            padding: 4px 10px;
            border-radius: var(--radius-xs);
            font-size: 11.5px;
            font-weight: 500;
            border: 1px solid;
        }
        .tag.blue { background: var(--accent-light); color: var(--accent); border-color: rgba(52,120,246,0.2); }
        .tag.green { background: var(--green-light); color: var(--green-dark); border-color: rgba(52,199,89,0.2); }
        .tag.purple { background: var(--purple-light); color: var(--purple); border-color: rgba(175,82,222,0.2); }
        .tag.orange { background: var(--orange-light); color: #b36b00; border-color: rgba(255,149,0,0.2); }
        .tag.teal { background: var(--teal-light); color: #0077b6; border-color: rgba(90,200,250,0.3); }
        .tag.neutral { background: var(--surface-2); color: var(--text-secondary); border-color: var(--border); }

        /* ── Mode Cards ── */
        .mode-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }
        .mode-card h4 {
            font-size: 16px;
            font-weight: 620;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mode-card p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .mode-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .mode-badge.auto { background: var(--green-light); color: var(--green-dark); }
        .mode-badge.manual { background: var(--orange-light); color: #b36b00; }

        /* ── Pending ── */
        .pending-block {
            text-align: center;
            padding: 72px 40px;
        }
        .pending-circle {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: var(--orange-light);
            border: 2px solid rgba(255,149,0,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px;
        }
        .pending-block h3 {
            font-size: 24px;
            font-weight: 650;
            margin-bottom: 10px;
        }
        .pending-block p {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 28px;
        }
        .planned-items {
            list-style: none;
            max-width: 460px;
            margin: 0 auto;
            text-align: left;
        }
        .planned-items li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-secondary);
        }
        .planned-items li:last-child { border-bottom: none; }
        .planned-items li::before {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--orange);
            flex-shrink: 0;
        }

        /* ── Categorization Tabs ── */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }
        .cat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }
        .cat-card h4 {
            font-size: 15px;
            font-weight: 620;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cat-card p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ── Annotated Images ── */
        .annotated-section {
            padding-bottom: 0;
            overflow: hidden;
        }
        .annotated-section > h3 { margin-bottom: 6px; }
        .annotated-section > p { margin-bottom: 16px; }
        .annotated-img {
            position: relative;
            margin: 16px -28px 0;
            border-top: 1px solid var(--border);
        }
        .annotated-img img {
            width: 100%;
            display: block;
        }
        .annotation {
            position: absolute;
            left: 2%;
            background: rgba(52, 120, 246, 0.88);
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.4;
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            max-width: 96%;
            backdrop-filter: blur(4px);
        }

        /* ── Section Nav (Prev / Next) ── */
        .section-nav {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 16px;
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }
        .section-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: all 0.2s;
            min-width: 0;
            flex: 1;
            max-width: 48%;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }
        .section-nav a:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            background: var(--accent-light);
        }
        .section-nav a.next {
            margin-left: auto;
            text-align: right;
            flex-direction: row-reverse;
        }
        .section-nav .nav-arrow {
            flex-shrink: 0;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--surface-2);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .section-nav a:hover .nav-arrow {
            background: var(--accent);
            color: #fff;
        }
        .section-nav .nav-arrow svg {
            width: 16px; height: 16px;
        }
        .section-nav .nav-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .section-nav .nav-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-nav .nav-title {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Footer ── */
        footer {
            border-top: 1px solid var(--border);
            padding: 28px 48px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            background: var(--surface);
        }

        /* ══ tabbed-doc-page additions: everything above is the template's CSS verbatim ══
           Only what the template lacks, built from its own tokens. Do not restyle the above. */
        .card code, .step code, .mode-card code, .cat-card code, .banner code, td code, li code {
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-size: 0.88em;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 1px 5px;
            overflow-wrap: anywhere;
        }
        pre.code {
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-size: 12.5px;
            line-height: 1.55;
            background: #0d0d0d;
            color: #e5e7eb;
            border: 1px solid #2a2a2a;
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            margin: 12px 0 4px;
            overflow-x: auto;
            white-space: pre;
        }
        table.doc-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        table.doc-table th {
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border);
        }
        table.doc-table td {
            font-size: 13.5px; color: var(--text-secondary); line-height: 1.5;
            padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top;
        }
        table.doc-table tr:last-child td { border-bottom: none; }
        table.doc-table td strong { color: var(--text); }
        .tag.red { background: var(--red-light); color: #c4241b; border-color: rgba(255,59,48,0.25); }
        .tag { white-space: nowrap; }
        .two-col { margin-bottom: 20px; }
        table.doc-table.keyed td:first-child { white-space: nowrap; }
        table.doc-table td .sub { display: block; white-space: normal; font-size: 12px; color: var(--text-muted); font-weight: 400; margin-top: 1px; }
        .banner.danger { background: var(--red-light); color: #c4241b; border: 1px solid rgba(255,59,48,0.25); }
        .card h4 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; color: var(--text); }
        .card ul.plain, .card ol.plain { padding-left: 20px; margin-top: 8px; }
        .card ul.plain li, .card ol.plain li { font-size: 14.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 6px; }
        @media print {
            .nav-bar, .section-nav { display: none !important; }
            .section { display: block !important; }
        }
    </style>
</head>
<body>

<!-- ═══════════════════ HERO ═══════════════════ -->
<div class="hero">
    <div class="hero-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
        {{BADGE}}
    </div>
    <h1>{{H1}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
</div>

<!-- ═══════════════════ NAV ═══════════════════ -->
<div class="nav-bar">
    <div class="nav-inner">
{{NAV_TABS}}
    </div>
</div>

<div class="container">

{{SECTIONS}}

</div><!-- /container -->

<footer>
    {{FOOTER}}
</footer>

<script>
function navigateToSection(sectionId) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    const targetTab = document.querySelector('.nav-tab[data-section="' + sectionId + '"]');
    if (targetTab) targetTab.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    window.scrollTo({ top: document.querySelector('.nav-bar').offsetTop, behavior: 'smooth' });
}

document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => navigateToSection(tab.dataset.section));
});

document.querySelectorAll('.ov-card[data-navigate]').forEach(card => {
    card.addEventListener('click', () => navigateToSection(card.dataset.navigate));
});

document.querySelectorAll('.section-nav a[data-nav]').forEach(link => {
    link.addEventListener('click', (e) => { e.preventDefault(); navigateToSection(link.dataset.nav); });
});
</script>

</body>
</html>
