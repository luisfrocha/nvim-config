<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  /* SF Pro Display via system font stack — no import needed */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --terra: #C2704E;
    --terra-light: #D4896A;
    --terra-dark: #A0573A;
    --terra-glow: rgba(194,112,78,0.12);
    --sand: #F5EDE3;
    --sand-light: #FAF7F2;
    --clay: #E8D5C4;
    --charcoal: #2D2926;
    --warm: #6B5E57;
    --warm-light: #9B8E86;
    --cream: #FFFBF5;
    --sage: #6B7F5E;
    --sage-light: #E8EDE5;
    --amber: #B8860B;
    --amber-light: #FFF8E7;
    --coral: #E8836B;
    --blue-soft: #5B7FA5;
    --blue-light: #EBF1F7;
    --plum: #8B6B7B;
    --plum-light: #F3ECF0;
  }

  html { overflow: hidden; }
  body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; background: var(--sand-light); color: var(--charcoal); overflow: hidden; height: 100vh; width: 100vw; }

  .slideshow { width: 100%; height: 100vh; position: relative; }

  .slide {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    pointer-events: none; z-index: 1;
  }
  .slide.active { opacity: 1; visibility: visible; pointer-events: all; transition: opacity 0.4s ease 0.15s, visibility 0s linear 0s; z-index: 10; }
  .slide.prev { opacity: 0; visibility: visible; z-index: 5; transition: opacity 0.3s ease, visibility 0s linear 0.4s; }

  /* Consistent 16:9 centered frame for ALL slides */
  .slide-frame {
    aspect-ratio: 16 / 9;
    max-width: 94%; max-height: 90%;
    width: 94%;
    padding: 44px 64px;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    box-sizing: border-box; overflow: hidden;
  }
  .slide-frame.centered { align-items: center; text-align: center; }
  .slide-frame.packed { padding: 32px 64px; }
  .slide-frame.full { padding: 0; align-items: stretch; }

  /* Nav */
  .nav { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; z-index: 200; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--clay); transition: all 0.3s; cursor: pointer; }
  .dot.active { background: var(--terra); width: 18px; border-radius: 3px; }
  .slide-counter { position: fixed; top: 20px; right: 32px; font-size: 12px; color: var(--warm-light); z-index: 200; display: flex; align-items: center; gap: 10px; }
  kbd { padding: 1px 5px; background: white; border: 1px solid var(--clay); border-radius: 3px; font-size: 10px; font-family: inherit; }

  /* Common */
  .step-label { font-size: 11px; font-weight: 700; color: var(--terra); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  h2 { font-family: -apple-system, 'SF Pro Display', sans-serif; font-size: 34px; font-weight: 700; color: #1D1D1F; letter-spacing: -0.5px; margin-bottom: 4px; }
  .slide-content { background: var(--sand-light); }
  .slide-content .desc, .slide-content > .slide-frame > p { font-size: 16px; color: var(--warm); line-height: 1.65; max-width: 860px; margin-bottom: 20px; }

  .tag { padding: 5px 16px; border-radius: 18px; font-size: 12px; font-weight: 600; display: inline-block; }
  .tag.t { background: var(--terra); color: white; }
  .tag.s { background: white; color: var(--terra); border: 1px solid var(--terra-light); }
  .tag.g { background: var(--sage-light); color: var(--sage); }
  .tag.b { background: var(--blue-light); color: var(--blue-soft); }
  .tag.p { background: var(--plum-light); color: var(--plum); }
  .tag.a { background: var(--amber-light); color: var(--amber); }

  /* Cards */
  .cards { display: grid; gap: 14px; width: 100%; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .c3 { grid-template-columns: 1fr 1fr 1fr; }
  .c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .card { background: white; border-radius: 14px; padding: 22px; border: 1px solid var(--clay); transition: all 0.2s; position: relative; overflow: hidden; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45,41,38,0.06); }
  .card h3 { font-size: 15px; font-weight: 600; color: var(--charcoal); margin-bottom: 5px; }
  .card p { font-size: 13px; color: var(--warm); line-height: 1.5; margin: 0; }
  .card-icon { font-size: 28px; margin-bottom: 8px; }
  .card.accent { border-left: 4px solid var(--terra); }
  .card.sage-accent { border-left: 4px solid var(--sage); }
  .card.blue-accent { border-left: 4px solid var(--blue-soft); }
  .card.plum-accent { border-left: 4px solid var(--plum); }
  .card.amber-accent { border-left: 4px solid var(--amber); }
  .card.filled { background: var(--terra); border-color: var(--terra); }
  .card.filled h3, .card.filled p { color: white; }
  .card.sage-filled { background: var(--sage); border-color: var(--sage); }
  .card.sage-filled h3, .card.sage-filled p { color: white; }
  .card.blue-filled { background: var(--blue-soft); border-color: var(--blue-soft); }
  .card.blue-filled h3, .card.blue-filled p { color: white; }

  /* Stats */
  .stats { display: flex; gap: 32px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-num { font-family: -apple-system, 'SF Pro Display', sans-serif; font-size: 38px; font-weight: 700; color: var(--terra); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--warm); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* SVG diagrams */
  svg text { font-family: -apple-system, 'SF Pro Display', sans-serif; }

  /* Flow pills */
  .flow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; width: 100%; }
  .pill { padding: 7px 13px; border-radius: 18px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill.code { background: var(--sage-light); color: var(--sage); }
  .pill.llm { background: #FFF0E8; color: var(--terra); }
  .pill-arr { color: var(--clay); font-size: 13px; }

  /* Highlight */
  .hl-box { background: var(--amber-light); border: 1px solid #E8D5A0; border-radius: 12px; padding: 16px 22px; width: 100%; margin-top: 12px; }
  .hl-box h4 { font-size: 14px; font-weight: 600; color: var(--amber); margin-bottom: 4px; }
  .hl-box p { font-size: 13px; color: var(--warm); line-height: 1.5; margin: 0; }
  .hl-box.terra { background: var(--terra-glow); border-color: var(--terra-light); }
  .hl-box.terra h4 { color: var(--terra-dark); }

  /* UI mockup */
  .mockup { background: white; border-radius: 16px; border: 1px solid var(--clay); overflow: hidden; width: 100%; box-shadow: 0 4px 20px rgba(45,41,38,0.06); }
  .mockup-bar { background: var(--charcoal); padding: 10px 16px; display: flex; gap: 6px; align-items: center; }
  .mockup-dot { width: 10px; height: 10px; border-radius: 50%; }
  .mockup-body { padding: 0; display: flex; min-height: 320px; }
  .mockup-sidebar { width: 200px; background: var(--sand); border-right: 1px solid var(--clay); padding: 16px; }
  .mockup-main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .mock-pill { padding: 6px 12px; border-radius: 8px; font-size: 11px; margin-bottom: 6px; }
  .mock-bubble { padding: 12px 16px; border-radius: 12px; font-size: 12px; line-height: 1.5; max-width: 85%; }
  .mock-user { background: var(--terra); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .mock-bot { background: var(--sand); color: var(--charcoal); align-self: flex-start; border-bottom-left-radius: 4px; }

  /* Title slide */
  .slide-hero { background: linear-gradient(135deg, var(--sand) 0%, var(--clay) 40%, var(--sand-light) 100%); text-align: center; }
  .slide-hero h1 { font-family: -apple-system, 'SF Pro Display', sans-serif; font-size: 52px; font-weight: 700; color: var(--terra-dark); margin-bottom: 14px; line-height: 1.15; }
  .slide-hero .subtitle { font-size: 19px; color: var(--warm); max-width: 680px; line-height: 1.6; margin-bottom: 24px; }
  .slide-hero .tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Animated pulse */
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes fadeInUp { 0% { opacity:0; transform:translateY(16px); } 100% { opacity:1; transform:translateY(0); } }
  @keyframes fadeInLeft { 0% { opacity:0; transform:translateX(-30px); } 100% { opacity:1; transform:translateX(0); } }
  @keyframes fadeInRight { 0% { opacity:0; transform:translateX(30px); } 100% { opacity:1; transform:translateX(0); } }

  /* Animated elements: start hidden, animation reveals them */
  .anim { opacity: 0; animation-fill-mode: forwards !important; }
  .pulse { animation: pulse 2s ease-in-out infinite; }

  /* Glassmorphic cards */
  .glass { background: rgba(255,251,245,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(194,112,78,0.12); border-radius: 20px; }

  /* Error / insight badges */
  .error-found { display: inline-flex; align-items: center; gap: 6px; background: #FEE2E2; color: #B91C1C; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .insight-found { display: inline-flex; align-items: center; gap: 6px; background: var(--sage-light); color: var(--sage); padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .beta-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--terra); color: white; padding: 4px 14px; border-radius: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }

  /* Two column layout */
  .two-col { display: flex; gap: 28px; width: 100%; }
  .two-col > div { flex: 1; }

  /* Feature list */
  .feat-list { list-style: none; }
  .feat-list li { padding: 8px 0; border-bottom: 1px solid var(--clay); font-size: 13px; color: var(--warm); display: flex; align-items: flex-start; gap: 10px; }
  .feat-list li:last-child { border-bottom: none; }
  .feat-check { width: 20px; height: 20px; border-radius: 50%; background: var(--sage-light); color: var(--sage); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }

  /* Section divider slide */
  .slide-divider { background: linear-gradient(135deg, var(--charcoal) 0%, #3D3632 100%); text-align: center; }
  .slide-divider h2 { color: var(--terra-light); font-size: 42px; }
  .slide-divider p { color: var(--warm-light); font-size: 18px; max-width: 600px; line-height: 1.6; }
  .slide-divider .step-label { color: var(--terra-light); }

  /* ===== terra-presentation additions (not in the original deck) ===== */
  /* Timed reveal: element fades in `data-at` ms after its slide becomes active */
  .seq { opacity: 0; transform: translateY(8px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .seq.on { opacity: 1; transform: none; }
  code.chip { background: var(--sand); padding: 2px 7px; border-radius: 5px; font-size: 10.5px; color: var(--warm); border: 1px solid var(--clay); }
</style>
</head>
<body>

<div class="slideshow">
  <div class="slide-counter"><span id="current">1</span> / <span id="total">1</span> &nbsp; <kbd>←</kbd> <kbd>→</kbd> <button id="fs-btn" onclick="toggleFullscreen()" style="background:none;border:1px solid var(--clay);border-radius:6px;padding:3px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;" title="Toggle fullscreen (F)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--warm-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div>

{{SLIDES}}
</div><!-- /slideshow -->

<!-- Nav (dots are generated by the script) -->
<div class="nav">
  <div class="dots" id="dots"></div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let current = 0;

  // Restore slide from URL hash on load (hash uses data-slide values: 1-based)
  const hashMatch = window.location.hash.match(/slide=(\d+)/);
  if (hashMatch) {
    const idx = Array.from(slides).findIndex(s => s.getAttribute('data-slide') === hashMatch[1]);
    if (idx >= 0) {
      slides[0].classList.remove('active');
      current = idx;
      slides[current].classList.add('active');
    }
  }

  document.getElementById('total').textContent = total;
  document.getElementById('current').textContent = current + 1;
  const dc = document.getElementById('dots');
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.onclick = () => goTo(i);
    dc.appendChild(d);
  }

  // On load, save each .anim element's original animation into a data attribute
  document.querySelectorAll('.anim').forEach(el => {
    const match = el.getAttribute('style')?.match(/animation:\s*([^;]+)/);
    if (match) el.dataset.anim = match[1].trim();
  });

  function restartAnimations(slide) {
    // Force animation restart by removing and re-adding from saved data-anim
    slide.querySelectorAll('.anim').forEach(el => {
      el.style.animation = 'none';
      el.offsetHeight; // force reflow
      el.style.animation = el.dataset.anim || '';
    });
  }

  // ===== Timed reveal: .seq[data-at=ms] fades in that long after the slide opens =====
  let seqTimers = [];
  function runSeq(slideEl) {
    seqTimers.forEach(clearTimeout);
    seqTimers = [];
    slideEl.querySelectorAll('.seq').forEach(el => {
      el.classList.remove('on');
      seqTimers.push(setTimeout(() => el.classList.add('on'), Number(el.dataset.at) || 0));
    });
  }

  // ===== Pipeline stepper: slides containing .pipe-step[data-step] =====
  // Steps start gray (pending), light up in order with a pulsing border, then settle to their own colors.
  // Connectors (.pipe-arrow[data-after=N]) fade in when step N becomes active. Loops forever.
  let pipelineTimer = null;
  function animatePipeline(slideEl) {
    if (pipelineTimer) { clearTimeout(pipelineTimer); pipelineTimer = null; }
    const steps = Array.from(slideEl.querySelectorAll('.pipe-step'))
      .sort((a, b) => Number(a.dataset.step) - Number(b.dataset.step));
    const arrows = slideEl.querySelectorAll('.pipe-arrow');
    if (!steps.length) return;

    // Remember each step's authored colors once, so "completed" restores exactly what the SVG says
    steps.forEach(s => {
      if (s._orig) return;
      const rect = s.querySelector('rect');
      s._orig = {
        fill: rect.getAttribute('fill'),
        stroke: rect.getAttribute('stroke'),
        width: rect.getAttribute('stroke-width'),
        texts: Array.from(s.querySelectorAll('text')).map(t => t.getAttribute('fill')),
      };
    });

    function setPending(s) {
      s.querySelectorAll('.pipe-pulse').forEach(a => a.remove());
      const rect = s.querySelector('rect');
      rect.setAttribute('fill', '#F3F4F6');
      rect.setAttribute('stroke', '#E5E7EB');
      rect.setAttribute('stroke-width', '1');
      s.querySelectorAll('text').forEach(t => t.setAttribute('fill', '#9CA3AF'));
      s.setAttribute('opacity', '1');
    }
    function setCompleted(s) {
      s.querySelectorAll('.pipe-pulse').forEach(a => a.remove());
      const rect = s.querySelector('rect');
      rect.setAttribute('fill', s._orig.fill);
      rect.setAttribute('stroke', s._orig.stroke);
      rect.setAttribute('stroke-width', s._orig.width);
      s.querySelectorAll('text').forEach((t, i) => t.setAttribute('fill', s._orig.texts[i]));
      s.setAttribute('opacity', '1');
    }
    function setActive(s) {
      setCompleted(s);
      const rect = s.querySelector('rect');
      rect.setAttribute('stroke', '#C2704E');
      rect.setAttribute('stroke-width', '2.5');
      // Smooth ease-in-out opacity pulse
      const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      anim.setAttribute('attributeName', 'opacity');
      anim.setAttribute('values', '1;0.4;1');
      anim.setAttribute('dur', '1.5s');
      anim.setAttribute('calcMode', 'spline');
      anim.setAttribute('keySplines', '0.4 0 0.6 1;0.4 0 0.6 1');
      anim.setAttribute('repeatCount', 'indefinite');
      anim.classList.add('pipe-pulse');
      s.appendChild(anim);
    }

    arrows.forEach(a => { a.style.transition = 'none'; a.setAttribute('opacity', '0'); });
    steps.forEach(setPending);

    const stepDelay = 550;
    let i = 0;
    function tick() {
      if (i > 0) setCompleted(steps[i - 1]);
      if (i < steps.length) {
        setActive(steps[i]);
        arrows.forEach(a => {
          if (Number(a.dataset.after) === i) {
            a.style.transition = 'opacity 0.25s';
            a.setAttribute('opacity', a.dataset.opacity || '1');
          }
        });
        i++;
        pipelineTimer = setTimeout(tick, stepDelay);
      } else {
        // All done — pause, fade out connectors, reset to pending, restart the cycle
        pipelineTimer = setTimeout(() => {
          arrows.forEach(a => { a.style.transition = 'opacity 0.4s'; a.setAttribute('opacity', '0'); });
          steps.forEach(setPending);
          pipelineTimer = setTimeout(() => animatePipeline(slideEl), 500);
        }, 1200);
      }
    }
    pipelineTimer = setTimeout(tick, 300);
  }

  // Per-slide animation hooks, run whenever a slide becomes current
  function enterSlide(slideEl) {
    restartAnimations(slideEl);
    runSeq(slideEl);
    if (pipelineTimer) { clearTimeout(pipelineTimer); pipelineTimer = null; }
    if (slideEl.querySelector('.pipe-step')) animatePipeline(slideEl);
  }

  function goTo(n) {
    if (n < 0 || n >= total || n === current) return;
    // Remove prev from any previous transition
    slides.forEach(s => s.classList.remove('prev'));
    // Outgoing slide becomes prev (stays visible underneath while it fades)
    slides[current].classList.remove('active');
    slides[current].classList.add('prev');
    const p = current;
    current = n;
    slides[current].classList.add('active');
    // Clean up prev after transition completes
    setTimeout(() => { slides[p].classList.remove('prev'); }, 600);
    document.getElementById('current').textContent = current + 1;
    document.querySelectorAll('.dot').forEach((d, i) => d.className = 'dot' + (i === current ? ' active' : ''));
    // Persist in URL hash
    window.location.hash = 'slide=' + slides[current].getAttribute('data-slide');
    enterSlide(slides[current]);
  }

  // Fullscreen toggle
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }
  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('fs-btn');
    if (!btn) return;
    btn.innerHTML = document.fullscreenElement
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--warm-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--warm-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
  });

  document.onkeydown = e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(current - 1); }
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
  };

  // Trigger animations on the initial slide
  enterSlide(slides[current]);
</script>
</body>
</html>
